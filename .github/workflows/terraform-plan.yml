name: Terraform Plan

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    strategy:
      matrix:
        include:
          - env: dev
            role_var: TERRAFORM_PLAN_ROLE_ARN_DEV
          - env: prod
            role_var: TERRAFORM_PLAN_ROLE_ARN_PROD
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.role_var] }}
          aws-region: us-east-1

      - run: terraform fmt -check -recursive
        working-directory: .

      - run: terraform init -backend-config=backend.hcl

      - run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -var-file=terraform.tfvars -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.env }}/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan — ${{ matrix.env }}\n\`\`\`\n${plan}\n\`\`\``,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
